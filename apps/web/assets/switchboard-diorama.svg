<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep-space signal field">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset=".48" stop-color="#0b1030"/><stop offset=".78" stop-color="#122046"/><stop offset="1" stop-color="#071022"/>
    </linearGradient>
    <radialGradient id="neb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#155e75" stop-opacity=".85"/><stop offset=".6" stop-color="#0e7490" stop-opacity=".28"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity=".65"/><stop offset=".65" stop-color="#4c1d95" stop-opacity=".22"/><stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ecfeff"/><stop offset=".25" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="b24" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="b10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g class="layer-nebula">
    <ellipse cx="380" cy="260" rx="430" ry="230" fill="url(#neb1)" filter="url(#b24)"/>
    <ellipse cx="1260" cy="360" rx="470" ry="260" fill="url(#neb2)" filter="url(#b24)"/>
    <ellipse cx="820" cy="700" rx="560" ry="200" fill="url(#neb1)" opacity=".55" filter="url(#b24)"/>
  </g>
  <g class="layer-stars" fill="#e0f2fe">
