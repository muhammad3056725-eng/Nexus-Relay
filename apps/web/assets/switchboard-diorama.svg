      <circle cx="590" cy="625" r="5.5"/><circle cx="800" cy="235" r="6"/>
    </g>
    <g stroke="#67e8f9" stroke-width="2" opacity=".55">
      <path d="M800 450 L465 330"/><path d="M800 450 L1135 330"/><path d="M800 450 L985 640"/><path d="M800 450 L590 625"/><path d="M800 450 L800 235"/>
    </g>
  </g>
  <rect y="760" width="1600" height="140" fill="#030712" opacity=".45"/>
