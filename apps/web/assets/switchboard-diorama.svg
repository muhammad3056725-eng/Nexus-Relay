    <circle cx="560" cy="210" r="1.3" opacity=".6"/><circle cx="700" cy="90" r="2.4"/><circle cx="880" cy="160" r="1.5" opacity=".75"/>
    <circle cx="1030" cy="60" r="1.9"/><circle cx="1190" cy="190" r="1.3" opacity=".6"/><circle cx="1360" cy="90" r="2.3"/>
    <circle cx="1500" cy="230" r="1.6" opacity=".8"/><circle cx="150" cy="420" r="1.5" opacity=".65"/><circle cx="330" cy="560" r="2" opacity=".8"/>
    <circle cx="620" cy="430" r="1.3" opacity=".55"/><circle cx="980" cy="480" r="1.7" opacity=".7"/><circle cx="1240" cy="600" r="1.4" opacity=".6"/>
    <circle cx="1450" cy="520" r="2.1" opacity=".85"/><circle cx="60" cy="700" r="1.6" opacity=".6"/><circle cx="520" cy="760" r="1.4" opacity=".55"/>
    <circle cx="1080" cy="790" r="1.8" opacity=".7"/><circle cx="1540" cy="760" r="1.3" opacity=".6"/><circle cx="760" cy="330" r="1.2" opacity=".5"/>
    <circle cx="210" cy="300" r="1.1" opacity=".5"/><circle cx="1390" cy="330" r="1.2" opacity=".5"/><circle cx="450" cy="660" r="1.2" opacity=".5"/>
  </g>
  <g class="layer-orbits" fill="none" stroke="#38bdf8">
    <ellipse cx="800" cy="450" rx="560" ry="190" stroke-width="2" opacity=".35" transform="rotate(-14 800 450)"/>
    <ellipse cx="800" cy="450" rx="700" ry="260" stroke-width="1.5" opacity=".2" transform="rotate(9 800 450)"/>
    <ellipse cx="800" cy="450" rx="330" ry="330" stroke-width="1.5" opacity=".28"/>
    <ellipse cx="800" cy="450" rx="215" ry="215" stroke-width="2" opacity=".45"/>
