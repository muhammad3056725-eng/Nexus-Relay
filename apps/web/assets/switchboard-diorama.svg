    <path d="M60 300 Q800 430 1540 280" stroke="url(#arc)" stroke-width="2" opacity=".45"/>
  </g>
  <g class="layer-nodes">
    <circle cx="800" cy="450" r="150" fill="url(#coreGlow)" filter="url(#b10)"/>
    <circle cx="800" cy="450" r="34" fill="#ecfeff"/>
    <circle cx="800" cy="450" r="21" fill="#06b6d4"/>
    <g fill="#a5f3fc">
