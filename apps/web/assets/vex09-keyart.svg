<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="VEX-09, your friendly relay operator">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/><stop offset=".55" stop-color="#082f49"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0b1226"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <circle cx="240" cy="235" r="185" fill="url(#halo)"/>
  <ellipse cx="240" cy="425" rx="118" ry="20" fill="#020617" opacity=".55" filter="url(#blur18)"/>
  <!-- antenna -->
  <path d="M240 118 V64" stroke="#7dd3fc" stroke-width="9" stroke-linecap="round"/>
  <circle cx="240" cy="52" r="17" fill="#22d3ee"/>
  <circle cx="240" cy="52" r="26" fill="none" stroke="#22d3ee" stroke-width="3" opacity=".45"/>
  <circle cx="234" cy="46" r="5" fill="#fff" opacity=".9"/>
  <!-- ears / signal pods -->
  <rect x="86" y="196" width="30" height="74" rx="15" fill="url(#shell)"/>
  <rect x="364" y="196" width="30" height="74" rx="15" fill="url(#shell)"/>
  <circle cx="101" cy="233" r="7" fill="#22d3ee"/><circle cx="379" cy="233" r="7" fill="#22d3ee"/>
  <!-- head -->
  <rect x="108" y="112" width="264" height="196" rx="58" fill="url(#shell)"/>
  <rect x="126" y="130" width="228" height="160" rx="46" fill="url(#visor)"/>
  <path d="M150 148 Q240 122 330 148" stroke="#bae6fd" stroke-width="7" stroke-linecap="round" fill="none" opacity=".55"/>
  <!-- face: friendly signal-wave eyes + smile -->
  <circle cx="192" cy="205" r="13" fill="#67e8f9"/>
  <circle cx="288" cy="205" r="13" fill="#67e8f9"/>
  <circle cx="188" cy="200" r="4.5" fill="#fff"/><circle cx="284" cy="200" r="4.5" fill="#fff"/>
  <path d="M205 248 Q240 272 275 248" stroke="#67e8f9" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M146 232 q10 -8 20 0 M314 232 q10 -8 20 0" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>
  <!-- neck + body -->
  <rect x="218" y="304" width="44" height="26" rx="10" fill="#334155"/>
  <path d="M150 356 Q150 330 182 330 H298 Q330 330 330 356 V404 Q330 432 302 432 H178 Q150 432 150 404 Z" fill="url(#body)" stroke="#38bdf8" stroke-width="3"/>
  <!-- arms -->
  <path d="M152 348 Q104 372 112 414" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M328 348 Q376 372 368 414" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" fill="none"/>
  <circle cx="113" cy="418" r="14" fill="#e0f2fe"/><circle cx="367" cy="418" r="14" fill="#e0f2fe"/>
  <!-- chest core -->
  <circle cx="240" cy="382" r="24" fill="#082f49" stroke="#22d3ee" stroke-width="3"/>
  <path d="M222 382 h12 l6 -12 9 22 6 -10 h13" stroke="#2dd4bf" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
