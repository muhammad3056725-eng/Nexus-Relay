# Builds, checks and deploys NEXUS RELAY to GitHub Pages
# (https://muhammad3056725-eng.github.io/Nexus-Relay/).
# Requires Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          pip install pytest
      - name: Typecheck
        run: npm run typecheck
      - name: Test (dataset gate + game tests + legacy pipeline tests)
        run: npm test
      - name: Build
        run: npm run build
      - name: Copy the dataset beside the built app
        run: cp -r public apps/web/dist/public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
